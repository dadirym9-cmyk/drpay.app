name: Build DRPay APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor Android & Browser plugin
        run: |
          npm install @capacitor/android --save --legacy-peer-deps
          npm install @capacitor/browser --save --legacy-peer-deps

      - name: Check Capacitor
        run: npx cap doctor

      - name: Build Next.js Web App
        run: |
          npm run build
        env:
          NEXT_PRIVATE_LOCAL_WEBPACK: "true"

      - name: Ensure out directory exists
        run: |
          if [ ! -d "out" ]; then
            mkdir -p out
            echo "<html><body><h1>DRPay App</h1></body></html>" > out/index.html
          fi

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DRPay-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
